<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Triage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sidebar: '#0f172a',
          }
        }
      }
    }
  </script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .modal-backdrop { backdrop-filter: blur(4px); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .fade-in { animation: fadeIn 0.15s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="module">
    import { createClient } from '@supabase/supabase-js';
    import React, { useState, useEffect, useCallback, useRef } from 'react';
    import { createRoot } from 'react-dom/client';

    const { createElement: h, Fragment } = React;

    const SUPABASE_URL = 'https://tgvctgcrjvrekyaeupvn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRndmN0Z2NyanZyZWt5YWV1cHZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTYxOTIsImV4cCI6MjA5NjA5MjE5Mn0.Iiz05f0RPMWImHnOEKZdpWtsKZhjHUZqtjiJSzhKuoI';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PRIORITY_ORDER = { urgent: 0, high: 1, medium: 2, low: 3 };
    const PRIORITY_COLORS = {
      urgent: 'bg-red-500/20 text-red-400 border border-red-500/30',
      high:   'bg-orange-500/20 text-orange-400 border border-orange-500/30',
      medium: 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30',
      low:    'bg-green-500/20 text-green-400 border border-green-500/30',
    };
    const STATUS_COLORS = {
      new:         'bg-blue-500/20 text-blue-400 border border-blue-500/30',
      in_progress: 'bg-purple-500/20 text-purple-400 border border-purple-500/30',
      blocked:     'bg-red-500/20 text-red-400 border border-red-500/30',
      done:        'bg-green-500/20 text-green-400 border border-green-500/30',
    };
    const STATUS_LABELS = { new: 'New', in_progress: 'In Progress', blocked: 'Blocked', done: 'Done' };
    const PRIORITY_LABELS = { urgent: 'Urgent', high: 'High', medium: 'Medium', low: 'Low' };

    function Badge({ value, map, labels }) {
      if (!value) return null;
      return h('span', { className: `inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${map[value] || 'bg-slate-700 text-slate-300'}` },
        labels[value] || value
      );
    }

    function PriorityBadge({ value }) { return h(Badge, { value, map: PRIORITY_COLORS, labels: PRIORITY_LABELS }); }
    function StatusBadge({ value }) { return h(Badge, { value, map: STATUS_COLORS, labels: STATUS_LABELS }); }

    function Select({ label, value, onChange, options, className = '' }) {
      return h('div', { className: `flex flex-col gap-1 ${className}` },
        label && h('label', { className: 'text-xs font-medium text-slate-400 uppercase tracking-wide' }, label),
        h('select', {
          value,
          onChange: e => onChange(e.target.value),
          className: 'bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent'
        },
          options.map(opt => h('option', { key: opt.value, value: opt.value }, opt.label))
        )
      );
    }

    function Input({ label, value, onChange, placeholder, required, className = '' }) {
      return h('div', { className: `flex flex-col gap-1 ${className}` },
        label && h('label', { className: 'text-xs font-medium text-slate-400 uppercase tracking-wide' },
          label, required && h('span', { className: 'text-red-400 ml-1' }, '*')
        ),
        h('input', {
          type: 'text',
          value,
          onChange: e => onChange(e.target.value),
          placeholder,
          className: 'bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent'
        })
      );
    }

    function Textarea({ label, value, onChange, placeholder, rows = 3, className = '' }) {
      return h('div', { className: `flex flex-col gap-1 ${className}` },
        label && h('label', { className: 'text-xs font-medium text-slate-400 uppercase tracking-wide' }, label),
        h('textarea', {
          value,
          onChange: e => onChange(e.target.value),
          placeholder,
          rows,
          className: 'bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none'
        })
      );
    }

    const EMPTY_FORM = { title: '', description: '', priority: 'medium', status: 'new', assignee: '', notes: '' };

    function RequestModal({ request, onClose, onSave, onDelete, loading }) {
      const [form, setForm] = useState(request ? { ...request } : { ...EMPTY_FORM });
      const [confirmDelete, setConfirmDelete] = useState(false);
      const isEdit = !!request;

      const set = key => val => setForm(f => ({ ...f, [key]: val }));

      const handleSave = () => {
        if (!form.title.trim()) return alert('Title is required');
        onSave(form);
      };

      const overlayRef = useRef(null);
      const handleOverlayClick = e => { if (e.target === overlayRef.current) onClose(); };

      return h('div', {
        ref: overlayRef,
        onClick: handleOverlayClick,
        className: 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-backdrop p-4'
      },
        h('div', { className: 'bg-slate-850 bg-slate-800 rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto border border-slate-700 fade-in' },
          h('div', { className: 'flex items-center justify-between p-6 border-b border-slate-700' },
            h('h2', { className: 'text-lg font-semibold text-slate-100' }, isEdit ? 'Edit Request' : 'New Request'),
            h('button', { onClick: onClose, className: 'text-slate-400 hover:text-slate-100 transition-colors text-xl leading-none' }, '✕')
          ),
          h('div', { className: 'p-6 flex flex-col gap-4' },
            h(Input, { label: 'Title', value: form.title, onChange: set('title'), placeholder: 'What needs to be done?', required: true }),
            h(Textarea, { label: 'Description', value: form.description || '', onChange: set('description'), placeholder: 'Describe the request...', rows: 3 }),
            h('div', { className: 'grid grid-cols-2 gap-4' },
              h(Select, {
                label: 'Priority',
                value: form.priority || 'medium',
                onChange: set('priority'),
                options: [
                  { value: 'urgent', label: 'Urgent' },
                  { value: 'high', label: 'High' },
                  { value: 'medium', label: 'Medium' },
                  { value: 'low', label: 'Low' },
                ]
              }),
              h(Select, {
                label: 'Status',
                value: form.status || 'new',
                onChange: set('status'),
                options: [
                  { value: 'new', label: 'New' },
                  { value: 'in_progress', label: 'In Progress' },
                  { value: 'blocked', label: 'Blocked' },
                  { value: 'done', label: 'Done' },
                ]
              })
            ),
            h(Input, { label: 'Assignee', value: form.assignee || '', onChange: set('assignee'), placeholder: 'Who owns this?' }),
            h(Textarea, { label: 'Notes', value: form.notes || '', onChange: set('notes'), placeholder: 'Any additional notes...', rows: 4 })
          ),
          h('div', { className: 'flex items-center justify-between p-6 border-t border-slate-700 gap-3' },
            isEdit
              ? (confirmDelete
                ? h('div', { className: 'flex items-center gap-2' },
                    h('span', { className: 'text-sm text-red-400' }, 'Delete this request?'),
                    h('button', {
                      onClick: () => onDelete(request.id),
                      disabled: loading,
                      className: 'px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-sm rounded-lg transition-colors disabled:opacity-50'
                    }, 'Confirm'),
                    h('button', {
                      onClick: () => setConfirmDelete(false),
                      className: 'px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm rounded-lg transition-colors'
                    }, 'Cancel')
                  )
                : h('button', {
                    onClick: () => setConfirmDelete(true),
                    className: 'px-3 py-1.5 text-red-400 hover:text-red-300 text-sm transition-colors'
                  }, 'Delete')
              )
              : h('div', {}),
            h('div', { className: 'flex gap-2' },
              h('button', {
                onClick: onClose,
                className: 'px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm rounded-lg transition-colors'
              }, 'Cancel'),
              h('button', {
                onClick: handleSave,
                disabled: loading,
                className: 'px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg transition-colors disabled:opacity-50 flex items-center gap-2'
              },
                loading && h('span', { className: 'inline-block w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin' }),
                isEdit ? 'Save Changes' : 'Create Request'
              )
            )
          )
        )
      );
    }

    function FilterChip({ label, active, onClick }) {
      return h('button', {
        onClick,
        className: `px-3 py-1.5 rounded-full text-xs font-medium transition-all border ${
          active
            ? 'bg-indigo-600 border-indigo-500 text-white'
            : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-slate-200 hover:border-slate-600'
        }`
      }, label);
    }

    function RequestCard({ request, onClick }) {
      const ts = new Date(request.created_at);
      const dateStr = ts.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      return h('div', {
        onClick: () => onClick(request),
        className: 'bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-xl p-4 cursor-pointer transition-all hover:shadow-lg hover:shadow-black/20 group'
      },
        h('div', { className: 'flex items-start justify-between gap-3' },
          h('div', { className: 'flex-1 min-w-0' },
            h('h3', { className: 'text-sm font-semibold text-slate-100 group-hover:text-white truncate' }, request.title),
            request.description && h('p', { className: 'text-xs text-slate-400 mt-1 line-clamp-2' }, request.description)
          ),
          h('div', { className: 'flex items-center gap-2 shrink-0' },
            h(PriorityBadge, { value: request.priority }),
            h(StatusBadge, { value: request.status })
          )
        ),
        h('div', { className: 'flex items-center gap-4 mt-3 text-xs text-slate-500' },
          request.assignee && h('span', { className: 'flex items-center gap-1' },
            h('span', { className: 'text-slate-400' }, '👤'),
            request.assignee
          ),
          request.notes && h('span', { className: 'flex items-center gap-1' },
            h('span', {}, '📝'),
            'Has notes'
          ),
          h('span', { className: 'ml-auto' }, dateStr)
        )
      );
    }

    function App() {
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [error, setError] = useState(null);
      const [modal, setModal] = useState(null);
      const [filterStatus, setFilterStatus] = useState('all');
      const [filterPriority, setFilterPriority] = useState('all');
      const [search, setSearch] = useState('');

      const fetchRequests = useCallback(async () => {
        setLoading(true);
        setError(null);
        const { data, error } = await supabase
          .from('requests')
          .select('*')
          .order('created_at', { ascending: false });
        if (error) setError(error.message);
        else setRequests(data || []);
        setLoading(false);
      }, []);

      useEffect(() => { fetchRequests(); }, [fetchRequests]);

      const handleSave = async (form) => {
        setSaving(true);
        if (form.id) {
          const { error } = await supabase
            .from('requests')
            .update({ ...form, updated_at: new Date().toISOString() })
            .eq('id', form.id);
          if (error) { alert('Error saving: ' + error.message); }
        } else {
          const { error } = await supabase
            .from('requests')
            .insert([{ ...form, created_at: new Date().toISOString(), updated_at: new Date().toISOString() }]);
          if (error) { alert('Error creating: ' + error.message); }
        }
        setSaving(false);
        setModal(null);
        fetchRequests();
      };

      const handleDelete = async (id) => {
        setSaving(true);
        const { error } = await supabase.from('requests').delete().eq('id', id);
        if (error) alert('Error deleting: ' + error.message);
        setSaving(false);
        setModal(null);
        fetchRequests();
      };

      const filtered = requests
        .filter(r => filterStatus === 'all' || r.status === filterStatus)
        .filter(r => filterPriority === 'all' || r.priority === filterPriority)
        .filter(r => !search || r.title?.toLowerCase().includes(search.toLowerCase()) || r.description?.toLowerCase().includes(search.toLowerCase()) || r.assignee?.toLowerCase().includes(search.toLowerCase()))
        .sort((a, b) => {
          const pd = (PRIORITY_ORDER[a.priority] ?? 99) - (PRIORITY_ORDER[b.priority] ?? 99);
          if (pd !== 0) return pd;
          return new Date(b.created_at) - new Date(a.created_at);
        });

      const counts = {
        all: requests.length,
        new: requests.filter(r => r.status === 'new').length,
        in_progress: requests.filter(r => r.status === 'in_progress').length,
        blocked: requests.filter(r => r.status === 'blocked').length,
        done: requests.filter(r => r.status === 'done').length,
      };

      return h(Fragment, {},
        h('header', { className: 'bg-slate-900 border-b border-slate-800 sticky top-0 z-40' },
          h('div', { className: 'max-w-5xl mx-auto px-6 h-14 flex items-center justify-between gap-4' },
            h('div', { className: 'flex items-center gap-3' },
              h('div', { className: 'w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center text-sm' }, '⚡'),
              h('span', { className: 'font-semibold text-slate-100 text-sm' }, 'Request Triage')
            ),
            h('div', { className: 'flex items-center gap-3' },
              h('input', {
                type: 'text',
                value: search,
                onChange: e => setSearch(e.target.value),
                placeholder: 'Search requests...',
                className: 'bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-52'
              }),
              h('button', {
                onClick: () => setModal('new'),
                className: 'flex items-center gap-2 px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors'
              },
                h('span', { className: 'text-base leading-none' }, '+'),
                'New Request'
              )
            )
          )
        ),

        h('main', { className: 'max-w-5xl mx-auto px-6 py-6' },

          h('div', { className: 'grid grid-cols-5 gap-3 mb-6' },
            [['all', 'Total', 'text-slate-300'], ['new', 'New', 'text-blue-400'], ['in_progress', 'In Progress', 'text-purple-400'], ['blocked', 'Blocked', 'text-red-400'], ['done', 'Done', 'text-green-400']]
              .map(([key, label, color]) =>
                h('div', { key, className: 'bg-slate-800 border border-slate-700 rounded-xl p-3 text-center' },
                  h('div', { className: `text-2xl font-bold ${color}` }, counts[key] || 0),
                  h('div', { className: 'text-xs text-slate-500 mt-0.5' }, label)
                )
              )
          ),

          h('div', { className: 'flex flex-wrap gap-2 mb-5' },
            h('div', { className: 'flex items-center gap-1.5 mr-2' },
              h('span', { className: 'text-xs text-slate-500 font-medium' }, 'Status:'),
              ['all', 'new', 'in_progress', 'blocked', 'done'].map(s =>
                h(FilterChip, {
                  key: s,
                  label: s === 'all' ? 'All' : STATUS_LABELS[s],
                  active: filterStatus === s,
                  onClick: () => setFilterStatus(s)
                })
              )
            ),
            h('div', { className: 'flex items-center gap-1.5 ml-2' },
              h('span', { className: 'text-xs text-slate-500 font-medium' }, 'Priority:'),
              ['all', 'urgent', 'high', 'medium', 'low'].map(p =>
                h(FilterChip, {
                  key: p,
                  label: p === 'all' ? 'All' : PRIORITY_LABELS[p],
                  active: filterPriority === p,
                  onClick: () => setFilterPriority(p)
                })
              )
            )
          ),

          error && h('div', { className: 'bg-red-500/10 border border-red-500/30 rounded-xl p-4 mb-5 text-red-400 text-sm' },
            '⚠️ Error loading requests: ', error,
            h('button', { onClick: fetchRequests, className: 'ml-3 underline' }, 'Retry')
          ),

          loading
            ? h('div', { className: 'flex items-center justify-center py-20' },
                h('div', { className: 'flex flex-col items-center gap-3' },
                  h('div', { className: 'w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin' }),
                  h('span', { className: 'text-sm text-slate-500' }, 'Loading requests...')
                )
              )
            : filtered.length === 0
              ? h('div', { className: 'flex flex-col items-center justify-center py-20 text-center' },
                  h('div', { className: 'text-4xl mb-3' }, '📋'),
                  h('p', { className: 'text-slate-400 font-medium' }, requests.length === 0 ? 'No requests yet' : 'No requests match your filters'),
                  h('p', { className: 'text-slate-500 text-sm mt-1' }, requests.length === 0 ? 'Create your first request to get started.' : 'Try adjusting your filters.'),
                  requests.length === 0 && h('button', {
                    onClick: () => setModal('new'),
                    className: 'mt-4 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg transition-colors'
                  }, '+ New Request')
                )
              : h('div', { className: 'flex flex-col gap-3' },
                  filtered.map(r =>
                    h(RequestCard, { key: r.id, request: r, onClick: setModal })
                  ),
                  h('p', { className: 'text-center text-xs text-slate-600 mt-2' }, `Showing ${filtered.length} of ${requests.length} requests`)
                )
        ),

        modal && h(RequestModal, {
          request: modal === 'new' ? null : modal,
          onClose: () => setModal(null),
          onSave: handleSave,
          onDelete: handleDelete,
          loading: saving
        })
      );
    }

    createRoot(document.getElementById('root')).render(h(App, null));
  </script>
</body>
</html>

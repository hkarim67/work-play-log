                        hovered===cat.id && h('button', {type:'button',
                          onClick:function(e){e.stopPropagation();props.onEditCategory(cat);},
                          style:{background:'none',border:'none',color:'#64748b',cursor:'pointer',fontSize:11,padding:'0 2px'}}, '✏️'))));
                })),
          h('div', {style:{borderTop:'1px solid #1e293b',padding:10,flexShrink:0}},
            h('div', {style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'6px 8px'}},
              h('div', {style:{display:'flex',alignItems:'center',gap:8,minWidth:0}},
                h('div', {style:{width:24,height:24,background:'#4f46e5',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,flexShrink:0}},
                  ((props.session&&props.session.user&&props.session.user.email&&props.session.user.email[0])||'?').toUpperCase()),
                h('span', {style:{fontSize:12,color:'#64748b',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}, props.session&&props.session.user&&props.session.user.email)),
              h('button', {type:'button', onClick:props.onSignOut,
                style:{background:'none',border:'none',color:'#475569',fontSize:12,cursor:'pointer',padding:'4px 6px',borderRadius:4}}, 'Sign out'))));
      }

      // MAIN APP
      function MainApp(props) {
        var cs = useState([]); var cats = cs[0]; var setCats = cs[1];
        var rs = useState([]); var reqs = rs[0]; var setReqs = rs[1];
        var ls = useState(true); var loading = ls[0]; var setLoading = ls[1];
        var sv = useState(false); var saving = sv[0]; var setSaving = sv[1];
        var ss = useState(null); var selCat = ss[0]; var setSelCat = ss[1];
        var rms = useState(null); var reqModal = rms[0]; var setReqModal = rms[1];
        var cms = useState(null); var catModal = cms[0]; var setCatModal = cms[1];
        var fss = useState('all'); var fStatus = fss[0]; var setFStatus = fss[1];
        var fps = useState('all'); var fPriority = fps[0]; var setFPriority = fps[1];
        var srs = useState(''); var search = srs[0]; var setSearch = srs[1];

        var fetchAll = useCallback(function() {
          setLoading(true);
          Promise.all([
            _supabase.from('categories').select('*').order('created_at'),
            _supabase.from('requests').select('*').order('created_at', {ascending:false})
          ]).then(function(res) {
            setCats(res[0].data||[]);
            setReqs(res[1].data||[]);
            setLoading(false);
          });
        }, []);

        useEffect(function(){ fetchAll(); }, [fetchAll]);

        var counts = {all:reqs.length};
        cats.forEach(function(c){ counts[c.id]=reqs.filter(function(r){return r.category_id===c.id;}).length; });

        var selCatObj = selCat ? cats.find(function(c){return c.id===selCat;}) : null;

        var filtered = reqs
          .filter(function(r){ return selCat===null||r.category_id===selCat; })
          .filter(function(r){ return fStatus==='all'||r.status===fStatus; })
          .filter(function(r){ return fPriority==='all'||r.priority===fPriority; })
          .filter(function(r){
            if(!search) return true;
            var s=search.toLowerCase();
            return (r.title&&r.title.toLowerCase().indexOf(s)>=0)||(r.description&&r.description.toLowerCase().indexOf(s)>=0)||(r.assignee&&r.assignee.toLowerCase().indexOf(s)>=0);
          })
          .sort(function(a,b){
            var pa=PRIORITY_ORDER[a.priority]!==undefined?PRIORITY_ORDER[a.priority]:99;
            var pb=PRIORITY_ORDER[b.priority]!==undefined?PRIORITY_ORDER[b.priority]:99;
            return pa!==pb ? pa-pb : new Date(b.created_at)-new Date(a.created_at);
          });

        var statCounts = {
          all:reqs.length,
          new:reqs.filter(function(r){return r.status==='new';}).length,
          in_progress:reqs.filter(function(r){return r.status==='in_progress';}).length,
          blocked:reqs.filter(function(r){return r.status==='blocked';}).length,
          done:reqs.filter(function(r){return r.status==='done';}).length
        };

        function saveCat(form){
          setSaving(true);
          var p=form.id?_supabase.from('categories').update({name:form.name,color:form.color}).eq('id',form.id):_supabase.from('categories').insert([{name:form.name,color:form.color}]);
          p.then(function(){setSaving(false);setCatModal(null);fetchAll();});
        }
        function delCat(id){
          setSaving(true);
          _supabase.from('categories').delete().eq('id',id).then(function(){
            if(selCat===id)setSelCat(null);
            setSaving(false);setCatModal(null);fetchAll();
          });
        }
        function saveReq(form){
          setSaving(true);
          var payload=Object.assign({},form,{category_id:form.category_id||null,updated_at:new Date().toISOString()});
          var p=form.id?_supabase.from('requests').update(payload).eq('id',form.id):_supabase.from('requests').insert([Object.assign({},payload,{created_at:new Date().toISOString()})]);
          p.then(function(){setSaving(false);setReqModal(null);fetchAll();});
        }
        function delReq(id){
          setSaving(true);
          _supabase.from('requests').delete().eq('id',id).then(function(){setSaving(false);setReqModal(null);fetchAll();});
        }

        var statRows = [['all','Total','#94a3b8'],['new','New','#60a5fa'],['in_progress','In Progress','#c084fc'],['blocked','Blocked','#f87171'],['done','Done','#4ade80']];

        return h('div', {style:{display:'flex',height:'100vh',overflow:'hidden'}},
          h(Sidebar, {categories:cats, selectedId:selCat, counts:counts, session:props.session,
            onSelectCategory:setSelCat, onNewCategory:function(){setCatModal('new');}, onEditCategory:function(c){setCatModal(c);}, onSignOut:function(){_supabase.auth.signOut();}}),
          h('div', {style:{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',marginLeft:256}},
            h('header', {style:{background:'#0f172a',borderBottom:'1px solid #1e293b',flexShrink:0}},
              h('div', {style:{padding:'0 24px',height:56,display:'flex',alignItems:'center',justifyContent:'space-between',gap:16}},
                h('div', {style:{display:'flex',alignItems:'center',gap:8}},
                  selCatObj
                    ? h(Fragment, null,
                        h('span',{style:{width:12,height:12,borderRadius:'50%',background:selCatObj.color,flexShrink:0,display:'inline-block'}}),
                        h('h1',{style:{fontSize:16,fontWeight:600}}, selCatObj.name),
                        h('button',{type:'button',onClick:function(){setCatModal(selCatObj);},style:{background:'none',border:'none',color:'#475569',cursor:'pointer',fontSize:13}}, '✏️'))
                    : h('h1',{style:{fontSize:16,fontWeight:600}}, 'All Requests')),
                h('div', {style:{display:'flex',alignItems:'center',gap:10}},
                  h('input', {type:'text',value:search,onChange:function(e){setSearch(e.target.value);},placeholder:'Search...',
                    style:{background:'#1e293b',border:'1px solid #334155',borderRadius:8,padding:'6px 12px',fontSize:13,color:'#f1f5f9',width:180,outline:'none'}}),
                  h('button', {type:'button', onClick:function(){setReqModal('new');},
                    style:{background:'#4f46e5',color:'#fff',border:'none',borderRadius:8,padding:'7px 16px',fontSize:13,fontWeight:500,cursor:'pointer',display:'flex',alignItems:'center',gap:4}},
                    '+ New Request')))),
            h('main', {style:{flex:1,overflowY:'auto',padding:24}},
              h('div', {style:{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:10,marginBottom:20}},
                statRows.map(function(row){
                  return h('div',{key:row[0],style:{background:'#1e293b',border:'1px solid #334155',borderRadius:12,padding:'10px 12px',textAlign:'center'}},
                    h('div',{style:{fontSize:24,fontWeight:700,color:row[2]}}, statCounts[row[0]]||0),
                    h('div',{style:{fontSize:11,color:'#64748b',marginTop:2}}, row[1]));
                })),
              h('div', {style:{display:'flex',flexWrap:'wrap',gap:8,marginBottom:20,alignItems:'center'}},
                h('span',{style:{fontSize:12,color:'#64748b',fontWeight:500}}, 'Status:'),
                ['all','new','in_progress','blocked','done'].map(function(s){
                  return h(Chip,{key:s,label:s==='all'?'All':STATUS_LABELS[s],active:fStatus===s,onClick:function(){setFStatus(s);}});
                }),
                h('span',{style:{fontSize:12,color:'#64748b',fontWeight:500,marginLeft:10}}, 'Priority:'),
                ['all','urgent','high','medium','low'].map(function(p){
                  return h(Chip,{key:p,label:p==='all'?'All':PRIORITY_LABELS[p],active:fPriority===p,onClick:function(){setFPriority(p);}});
                })),
              loading
                ? h('div',{style:{display:'flex',justifyContent:'center',padding:'80px 0'}},
                    h('div',{style:{width:32,height:32,border:'2px solid #312e81',borderTopColor:'#818cf8',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}))
                : filtered.length===0
                  ? h('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',padding:'80px 0',textAlign:'center'}},
                      h('div',{style:{fontSize:40,marginBottom:12}}, '📋'),
                      h('p',{style:{color:'#94a3b8',fontWeight:500}}, reqs.length===0?'No requests yet':'No requests match'),
                      h('p',{style:{color:'#64748b',fontSize:13,marginTop:4}}, 'Create your first request to get started.'),
                      h('button',{type:'button',onClick:function(){setReqModal('new');},
                        style:{marginTop:16,background:'#4f46e5',color:'#fff',border:'none',borderRadius:8,padding:'8px 18px',fontSize:13,cursor:'pointer'}}, '+ New Request'))
                  : h('div',{style:{display:'flex',flexDirection:'column',gap:10}},
                      filtered.map(function(r){
                        var cat=r.category_id?cats.find(function(c){return c.id===r.category_id;}):null;
                        return h(RequestCard,{key:r.id,request:r,category:cat,onClick:setReqModal});
                      }),
                      h('p',{style:{textAlign:'center',fontSize:12,color:'#334155',marginTop:8}}, filtered.length+' of '+reqs.length+' requests')))),
          reqModal && h(RequestModal,{request:reqModal==='new'?null:reqModal,categories:cats,
            onClose:function(){setReqModal(null);},onSave:saveReq,onDelete:delReq,loading:saving}),
          catModal && h(CategoryModal,{category:catModal==='new'?null:catModal,
            onClose:function(){setCatModal(null);},onSave:saveCat,onDelete:delCat,loading:saving}));
      }

      // ROOT
      function App() {
        var ss = useState(null); var session = ss[0]; var setSession = ss[1];
        var ls = useState(true); var authLoading = ls[0]; var setAuthLoading = ls[1];
        useEffect(function(){
          _supabase.auth.getSession().then(function(r){
            setSession(r.data.session);
            setAuthLoading(false);
          });
          var sub = _supabase.auth.onAuthStateChange(function(_e,s){ setSession(s); });
          return function(){ sub.data.subscription.unsubscribe(); };
        },[]);
        if(authLoading) return h('div',{style:{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}},
          h('div',{style:{width:32,height:32,border:'2px solid #312e81',borderTopColor:'#818cf8',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}));
        return session ? h(MainApp,{session:session}) : h(LoginPage,null);
      }

      // Boot
      document.getElementById('boot').style.display = 'none';
      ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
    })();
  </script>
</body>
</html>

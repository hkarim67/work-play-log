<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Request Triage</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18",
      "react-dom/client": "https://esm.sh/react-dom@18/client",
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .modal-backdrop { backdrop-filter: blur(4px); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    .fade-in { animation: fadeIn 0.15s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div id="root"></div>
  <script type="module">
    import { createClient } from '@supabase/supabase-js';
    import React, { useState, useEffect, useCallback, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    const { createElement: h, Fragment } = React;

    const SUPABASE_URL = 'https://tgvctgcrjvrekyaeupvn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRndmN0Z2NyanZyZWt5YWV1cHZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTYxOTIsImV4cCI6MjA5NjA5MjE5Mn0.Iiz05f0RPMWImHnOEKZdpWtsKZhjHUZqtjiJSzhKuoI';
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const PRIORITY_ORDER = { urgent: 0, high: 1, medium: 2, low: 3 };
    const PRIORITY_COLORS = {
      urgent: 'bg-red-500/20 text-red-400 border border-red-500/30',
      high:   'bg-orange-500/20 text-orange-400 border border-orange-500/30',
      medium: 'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30',
      low:    'bg-green-500/20 text-green-400 border border-green-500/30',
    };
    const STATUS_COLORS = {
      new:         'bg-blue-500/20 text-blue-400 border border-blue-500/30',
      in_progress: 'bg-purple-500/20 text-purple-400 border border-purple-500/30',
      blocked:     'bg-red-500/20 text-red-400 border border-red-500/30',
      done:        'bg-green-500/20 text-green-400 border border-green-500/30',
    };
    const STATUS_LABELS = { new: 'New', in_progress: 'In Progress', blocked: 'Blocked', done: 'Done' };
    const PRIORITY_LABELS = { urgent: 'Urgent', high: 'High', medium: 'Medium', low: 'Low' };
    const CATEGORY_COLORS = ['#6366f1','#3b82f6','#22c55e','#eab308','#f97316','#ef4444','#ec4899','#a855f7'];

    function Badge({ value, map, labels }) {
      if (!value) return null;
      return h('span', { className: `inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium ${map[value] || 'bg-slate-700 text-slate-300'}` }, labels[value] || value);
    }
    function PriorityBadge({ value }) { return h(Badge, { value, map: PRIORITY_COLORS, labels: PRIORITY_LABELS }); }
    function StatusBadge({ value }) { return h(Badge, { value, map: STATUS_COLORS, labels: STATUS_LABELS }); }

    function Input({ label, value, onChange, placeholder, required, type = 'text', className = '' }) {
      return h('div', { className: `flex flex-col gap-1 ${className}` },
        label && h('label', { className: 'text-xs font-medium text-slate-400 uppercase tracking-wide' },
          label, required && h('span', { className: 'text-red-400 ml-1' }, '*')),
        h('input', { type, value, onChange: e => onChange(e.target.value), placeholder,
          className: 'bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent' }));
    }

    function Textarea({ label, value, onChange, placeholder, rows = 3, className = '' }) {
      return h('div', { className: `flex flex-col gap-1 ${className}` },
        label && h('label', { className: 'text-xs font-medium text-slate-400 uppercase tracking-wide' }, label),
        h('textarea', { value, onChange: e => onChange(e.target.value), placeholder, rows,
          className: 'bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none' }));
    }

    function Select({ label, value, onChange, options, className = '' }) {
      return h('div', { className: `flex flex-col gap-1 ${className}` },
        label && h('label', { className: 'text-xs font-medium text-slate-400 uppercase tracking-wide' }, label),
        h('select', { value, onChange: e => onChange(e.target.value),
          className: 'bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent' },
          options.map(opt => h('option', { key: opt.value, value: opt.value }, opt.label))));
    }

    function FilterChip({ label, active, onClick }) {
      return h('button', { onClick,
        className: `px-3 py-1.5 rounded-full text-xs font-medium transition-all border ${active ? 'bg-indigo-600 border-indigo-500 text-white' : 'bg-slate-800 border-slate-700 text-slate-400 hover:text-slate-200 hover:border-slate-600'}` }, label);
    }

    // --- Login Page ---
    function LoginPage() {
      const [mode, setMode] = useState('signin');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [message, setMessage] = useState('');

      const handleSubmit = async (e) => {
        e.preventDefault();
        setLoading(true); setError(''); setMessage('');
        if (mode === 'signin') {
          const { error } = await supabase.auth.signInWithPassword({ email, password });
          if (error) setError(error.message);
        } else {
          const { error } = await supabase.auth.signUp({ email, password });
          if (error) setError(error.message);
          else setMessage('Account created! Check your email to confirm, then sign in.');
        }
        setLoading(false);
      };

      return h('div', { className: 'min-h-screen bg-slate-900 flex items-center justify-center p-4' },
        h('div', { className: 'w-full max-w-sm' },
          h('div', { className: 'text-center mb-8' },
            h('div', { className: 'w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4' }, '⚡'),
            h('h1', { className: 'text-2xl font-bold text-slate-100' }, 'Request Triage'),
            h('p', { className: 'text-slate-400 text-sm mt-1' }, mode === 'signin' ? 'Sign in to your workspace' : 'Create your workspace')),
          h('div', { className: 'bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl' },
            h('form', { onSubmit: handleSubmit, className: 'flex flex-col gap-4' },
              h(Input, { label: 'Email', value: email, onChange: setEmail, placeholder: 'you@example.com', type: 'email', required: true }),
              h(Input, { label: 'Password', value: password, onChange: setPassword, placeholder: '••••••••', type: 'password', required: true }),
              error && h('p', { className: 'text-red-400 text-sm bg-red-500/10 border border-red-500/20 rounded-lg px-3 py-2' }, error),
              message && h('p', { className: 'text-green-400 text-sm bg-green-500/10 border border-green-500/20 rounded-lg px-3 py-2' }, message),
              h('button', { type: 'submit', disabled: loading,
                className: 'w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors disabled:opacity-50 flex items-center justify-center gap-2' },
                loading && h('span', { className: 'inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin' }),
                mode === 'signin' ? 'Sign In' : 'Create Account')),
            h('div', { className: 'mt-4 text-center' },
              h('button', { onClick: () => { setMode(m => m === 'signin' ? 'signup' : 'signin'); setError(''); setMessage(''); },
                className: 'text-sm text-slate-400 hover:text-indigo-400 transition-colors' },
                mode === 'signin' ? "Don't have an account? Sign up" : 'Already have an account? Sign in')))));
    }

    // --- Category Modal ---
    function CategoryModal({ category, onClose, onSave, onDelete, loading }) {
      const [name, setName] = useState(category?.name || '');
      const [color, setColor] = useState(category?.color || CATEGORY_COLORS[0]);
      const [confirmDelete, setConfirmDelete] = useState(false);
      const isEdit = !!category;
      const overlayRef = useRef(null);
      const handleOverlayClick = e => { if (e.target === overlayRef.current) onClose(); };

      return h('div', { ref: overlayRef, onClick: handleOverlayClick, className: 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-backdrop p-4' },
        h('div', { className: 'bg-slate-800 rounded-2xl shadow-2xl w-full max-w-sm border border-slate-700 fade-in' },
          h('div', { className: 'flex items-center justify-between p-5 border-b border-slate-700' },
            h('h2', { className: 'text-base font-semibold text-slate-100' }, isEdit ? 'Edit Category' : 'New Category'),
            h('button', { onClick: onClose, className: 'text-slate-400 hover:text-slate-100 text-xl leading-none' }, '✕')),
          h('div', { className: 'p-5 flex flex-col gap-4' },
            h(Input, { label: 'Name', value: name, onChange: setName, placeholder: 'e.g. Bug Reports', required: true }),
            h('div', { className: 'flex flex-col gap-2' },
              h('label', { className: 'text-xs font-medium text-slate-400 uppercase tracking-wide' }, 'Color'),
              h('div', { className: 'flex gap-2 flex-wrap' },
                CATEGORY_COLORS.map(c =>
                  h('button', { key: c, onClick: () => setColor(c), type: 'button',
                    className: `w-8 h-8 rounded-full transition-all ${color === c ? 'ring-2 ring-white ring-offset-2 ring-offset-slate-800 scale-110' : 'hover:scale-110'}`,
                    style: { backgroundColor: c } }))))),
          h('div', { className: 'flex items-center justify-between p-5 border-t border-slate-700' },
            isEdit ? (confirmDelete
              ? h('div', { className: 'flex items-center gap-2' },
                  h('span', { className: 'text-sm text-red-400' }, 'Delete?'),
                  h('button', { onClick: () => onDelete(category.id), disabled: loading, className: 'px-3 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs rounded-lg' }, 'Yes'),
                  h('button', { onClick: () => setConfirmDelete(false), className: 'px-3 py-1.5 bg-slate-700 text-slate-200 text-xs rounded-lg' }, 'No'))
              : h('button', { onClick: () => setConfirmDelete(true), className: 'text-sm text-red-400 hover:text-red-300' }, 'Delete'))
            : h('div', {}),
            h('div', { className: 'flex gap-2' },
              h('button', { onClick: onClose, className: 'px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm rounded-lg' }, 'Cancel'),
              h('button', { onClick: () => { if (!name.trim()) return alert('Name required'); onSave({ ...category, name, color }); },
                disabled: loading, className: 'px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg disabled:opacity-50' },
                isEdit ? 'Save' : 'Create'))));
    }

    // --- Request Modal ---
    const EMPTY_FORM = { title: '', description: '', priority: 'medium', status: 'new', assignee: '', notes: '', category_id: '' };

    function RequestModal({ request, categories, onClose, onSave, onDelete, loading }) {
      const [form, setForm] = useState(request ? { ...request, category_id: request.category_id || '' } : { ...EMPTY_FORM });
      const [confirmDelete, setConfirmDelete] = useState(false);
      const isEdit = !!request;
      const set = key => val => setForm(f => ({ ...f, [key]: val }));
      const overlayRef = useRef(null);
      const handleOverlayClick = e => { if (e.target === overlayRef.current) onClose(); };
      const catOptions = [{ value: '', label: 'No Category' }, ...categories.map(c => ({ value: c.id, label: c.name }))];

      return h('div', { ref: overlayRef, onClick: handleOverlayClick, className: 'fixed inset-0 z-50 flex items-center justify-center bg-black/60 modal-backdrop p-4' },
        h('div', { className: 'bg-slate-800 rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto border border-slate-700 fade-in' },
          h('div', { className: 'flex items-center justify-between p-6 border-b border-slate-700' },
            h('h2', { className: 'text-lg font-semibold text-slate-100' }, isEdit ? 'Edit Request' : 'New Request'),
            h('button', { onClick: onClose, className: 'text-slate-400 hover:text-slate-100 text-xl leading-none' }, '✕')),
          h('div', { className: 'p-6 flex flex-col gap-4' },
            h(Input, { label: 'Title', value: form.title, onChange: set('title'), placeholder: 'What needs to be done?', required: true }),
            h(Textarea, { label: 'Description', value: form.description || '', onChange: set('description'), placeholder: 'Describe the request...', rows: 3 }),
            h('div', { className: 'grid grid-cols-2 gap-4' },
              h(Select, { label: 'Priority', value: form.priority || 'medium', onChange: set('priority'), options: [{value:'urgent',label:'Urgent'},{value:'high',label:'High'},{value:'medium',label:'Medium'},{value:'low',label:'Low'}] }),
              h(Select, { label: 'Status', value: form.status || 'new', onChange: set('status'), options: [{value:'new',label:'New'},{value:'in_progress',label:'In Progress'},{value:'blocked',label:'Blocked'},{value:'done',label:'Done'}] })),
            h('div', { className: 'grid grid-cols-2 gap-4' },
              h(Input, { label: 'Assignee', value: form.assignee || '', onChange: set('assignee'), placeholder: 'Who owns this?' }),
              h(Select, { label: 'Category', value: form.category_id || '', onChange: set('category_id'), options: catOptions })),
            h(Textarea, { label: 'Notes', value: form.notes || '', onChange: set('notes'), placeholder: 'Any additional notes...', rows: 3 })),
          h('div', { className: 'flex items-center justify-between p-6 border-t border-slate-700' },
            isEdit ? (confirmDelete
              ? h('div', { className: 'flex items-center gap-2' },
                  h('span', { className: 'text-sm text-red-400' }, 'Delete this request?'),
                  h('button', { onClick: () => onDelete(request.id), disabled: loading, className: 'px-3 py-1.5 bg-red-600 text-white text-sm rounded-lg' }, 'Confirm'),
                  h('button', { onClick: () => setConfirmDelete(false), className: 'px-3 py-1.5 bg-slate-700 text-slate-200 text-sm rounded-lg' }, 'Cancel'))
              : h('button', { onClick: () => setConfirmDelete(true), className: 'text-sm text-red-400 hover:text-red-300' }, 'Delete'))
            : h('div', {}),
            h('div', { className: 'flex gap-2' },
              h('button', { onClick: onClose, className: 'px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm rounded-lg' }, 'Cancel'),
              h('button', { onClick: () => { if (!form.title.trim()) return alert('Title required'); onSave({ ...form, category_id: form.category_id || null }); },
                disabled: loading, className: 'px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg disabled:opacity-50 flex items-center gap-2' },
                loading && h('span', { className: 'inline-block w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin' }),
                isEdit ? 'Save Changes' : 'Create Request'))));
    }

    // --- Request Card ---
    function RequestCard({ request, category, onClick }) {
      const dateStr = new Date(request.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      return h('div', { onClick: () => onClick(request), className: 'bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-xl p-4 cursor-pointer transition-all hover:shadow-lg group' },
        h('div', { className: 'flex items-start justify-between gap-3' },
          h('div', { className: 'flex-1 min-w-0' },
            category && h('div', { className: 'mb-1.5' },
              h('span', { className: 'inline-flex items-center gap-1.5 text-xs font-medium px-2 py-0.5 rounded-full',
                style: { backgroundColor: category.color + '20', color: category.color, border: `1px solid ${category.color}40` } },
                h('span', { className: 'w-1.5 h-1.5 rounded-full', style: { backgroundColor: category.color } }), category.name)),
            h('h3', { className: 'text-sm font-semibold text-slate-100 group-hover:text-white truncate' }, request.title),
            request.description && h('p', { className: 'text-xs text-slate-400 mt-1 line-clamp-2' }, request.description)),
          h('div', { className: 'flex flex-col items-end gap-1.5 shrink-0' },
            h(PriorityBadge, { value: request.priority }),
            h(StatusBadge, { value: request.status }))),
        h('div', { className: 'flex items-center gap-3 mt-3 text-xs text-slate-500' },
          request.assignee && h('span', {}, '👤 ', request.assignee),
          request.notes && h('span', {}, '📝 Notes'),
          h('span', { className: 'ml-auto' }, dateStr)));
    }

    // --- Sidebar ---
    function Sidebar({ categories, selectedCategoryId, onSelectCategory, onNewCategory, onEditCategory, requestCounts, session, onSignOut }) {
      const [hoveredCat, setHoveredCat] = useState(null);
      return h('aside', { className: 'w-64 bg-slate-950 border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-30' },
        h('div', { className: 'flex items-center gap-3 px-4 py-4 border-b border-slate-800 shrink-0' },
          h('div', { className: 'w-7 h-7 bg-indigo-600 rounded-lg flex items-center justify-center text-sm' }, '⚡'),
          h('span', { className: 'font-semibold text-slate-100 text-sm' }, 'Request Triage')),
        h('nav', { className: 'flex-1 overflow-y-auto p-3' },
          h('button', { onClick: () => onSelectCategory(null),
            className: `w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors mb-1 ${selectedCategoryId === null ? 'bg-indigo-600/20 text-indigo-300 font-medium' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}` },
            h('span', { className: 'flex items-center gap-2' }, h('span', {}, '📋'), 'All Requests'),
            h('span', { className: 'text-xs bg-slate-700/80 px-1.5 py-0.5 rounded-full' }, requestCounts.all || 0)),
          h('div', { className: 'flex items-center justify-between px-3 pt-4 pb-1' },
            h('span', { className: 'text-xs font-semibold text-slate-500 uppercase tracking-wider' }, 'Categories'),
            h('button', { onClick: onNewCategory, className: 'text-slate-500 hover:text-indigo-400 text-lg leading-none transition-colors', title: 'New category' }, '+')),
          categories.length === 0
            ? h('p', { className: 'text-xs text-slate-600 px-3 py-2 italic' }, 'No categories yet')
            : categories.map(cat =>
                h('div', { key: cat.id, className: 'relative group/item',
                  onMouseEnter: () => setHoveredCat(cat.id), onMouseLeave: () => setHoveredCat(null) },
                  h('button', { onClick: () => onSelectCategory(cat.id),
                    className: `w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm transition-colors ${selectedCategoryId === cat.id ? 'bg-slate-700 text-slate-100 font-medium' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}` },
                    h('span', { className: 'flex items-center gap-2 min-w-0' },
                      h('span', { className: 'w-2 h-2 rounded-full shrink-0', style: { backgroundColor: cat.color } }),
                      h('span', { className: 'truncate' }, cat.name)),
                    h('div', { className: 'flex items-center gap-1 shrink-0' },
                      h('span', { className: 'text-xs bg-slate-700/80 px-1.5 py-0.5 rounded-full' }, requestCounts[cat.id] || 0),
                      hoveredCat === cat.id && h('button', { onClick: e => { e.stopPropagation(); onEditCategory(cat); },
                        className: 'text-slate-500 hover:text-slate-200 ml-0.5 transition-colors text-xs' }, '✏️')))))),
        h('div', { className: 'border-t border-slate-800 p-3 shrink-0' },
          h('div', { className: 'flex items-center justify-between px-2 py-1.5' },
            h('div', { className: 'flex items-center gap-2 min-w-0' },
              h('div', { className: 'w-6 h-6 bg-indigo-600 rounded-full flex items-center justify-center text-xs font-bold shrink-0' },
                (session?.user?.email?.[0] || '?').toUpperCase()),
              h('span', { className: 'text-xs text-slate-400 truncate' }, session?.user?.email)),
            h('button', { onClick: onSignOut, title: 'Sign out',
              className: 'text-xs text-slate-500 hover:text-slate-300 ml-2 shrink-0 px-2 py-1 rounded hover:bg-slate-800 transition-colors' }, 'Sign out'))));
    }

    // --- Main App (authenticated) ---
    function MainApp({ session }) {
      const [categories, setCategories] = useState([]);
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [saving, setSaving] = useState(false);
      const [selectedCategoryId, setSelectedCategoryId] = useState(null);
      const [requestModal, setRequestModal] = useState(null);
      const [categoryModal, setCategoryModal] = useState(null);
      const [filterStatus, setFilterStatus] = useState('all');
      const [filterPriority, setFilterPriority] = useState('all');
      const [search, setSearch] = useState('');

      const fetchAll = useCallback(async () => {
        setLoading(true);
        const [{ data: cats }, { data: reqs }] = await Promise.all([
          supabase.from('categories').select('*').order('created_at'),
          supabase.from('requests').select('*').order('created_at', { ascending: false })
        ]);
        setCategories(cats || []);
        setRequests(reqs || []);
        setLoading(false);
      }, []);

      useEffect(() => { fetchAll(); }, [fetchAll]);

      const requestCounts = { all: requests.length };
      categories.forEach(cat => { requestCounts[cat.id] = requests.filter(r => r.category_id === cat.id).length; });

      const selectedCategory = selectedCategoryId ? categories.find(c => c.id === selectedCategoryId) : null;

      const filtered = requests
        .filter(r => selectedCategoryId === null || r.category_id === selectedCategoryId)
        .filter(r => filterStatus === 'all' || r.status === filterStatus)
        .filter(r => filterPriority === 'all' || r.priority === filterPriority)
        .filter(r => !search || [r.title, r.description, r.assignee].some(f => f?.toLowerCase().includes(search.toLowerCase())))
        .sort((a, b) => {
          const pd = (PRIORITY_ORDER[a.priority] ?? 99) - (PRIORITY_ORDER[b.priority] ?? 99);
          return pd !== 0 ? pd : new Date(b.created_at) - new Date(a.created_at);
        });

      const counts = {
        all: requests.length,
        new: requests.filter(r => r.status === 'new').length,
        in_progress: requests.filter(r => r.status === 'in_progress').length,
        blocked: requests.filter(r => r.status === 'blocked').length,
        done: requests.filter(r => r.status === 'done').length,
      };

      const handleSaveCategory = async (form) => {
        setSaving(true);
        if (form.id) await supabase.from('categories').update({ name: form.name, color: form.color }).eq('id', form.id);
        else await supabase.from('categories').insert([{ name: form.name, color: form.color }]);
        setSaving(false); setCategoryModal(null); fetchAll();
      };
      const handleDeleteCategory = async (id) => {
        setSaving(true);
        await supabase.from('categories').delete().eq('id', id);
        if (selectedCategoryId === id) setSelectedCategoryId(null);
        setSaving(false); setCategoryModal(null); fetchAll();
      };
      const handleSaveRequest = async (form) => {
        setSaving(true);
        const payload = { ...form, category_id: form.category_id || null, updated_at: new Date().toISOString() };
        if (form.id) await supabase.from('requests').update(payload).eq('id', form.id);
        else await supabase.from('requests').insert([{ ...payload, created_at: new Date().toISOString() }]);
        setSaving(false); setRequestModal(null); fetchAll();
      };
      const handleDeleteRequest = async (id) => {
        setSaving(true);
        await supabase.from('requests').delete().eq('id', id);
        setSaving(false); setRequestModal(null); fetchAll();
      };

      return h('div', { className: 'flex h-screen overflow-hidden bg-slate-900' },
        h(Sidebar, { categories, selectedCategoryId, requestCounts, session,
          onSelectCategory: setSelectedCategoryId,
          onNewCategory: () => setCategoryModal('new'),
          onEditCategory: cat => setCategoryModal(cat),
          onSignOut: () => supabase.auth.signOut() }),
        h('div', { className: 'flex-1 flex flex-col overflow-hidden ml-64' },
          h('header', { className: 'bg-slate-900 border-b border-slate-800 shrink-0' },
            h('div', { className: 'px-6 h-14 flex items-center justify-between gap-4' },
              h('div', { className: 'flex items-center gap-2' },
                selectedCategory
                  ? h(Fragment, {},
                      h('span', { className: 'w-3 h-3 rounded-full shrink-0', style: { backgroundColor: selectedCategory.color } }),
                      h('h1', { className: 'font-semibold text-slate-100' }, selectedCategory.name),
                      h('button', { onClick: () => setCategoryModal(selectedCategory), className: 'text-slate-500 hover:text-slate-300 text-sm' }, '✏️'))
                  : h('h1', { className: 'font-semibold text-slate-100' }, 'All Requests')),
              h('div', { className: 'flex items-center gap-3' },
                h('input', { type: 'text', value: search, onChange: e => setSearch(e.target.value), placeholder: 'Search...',
                  className: 'bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 w-48' }),
                h('button', { onClick: () => setRequestModal('new'),
                  className: 'flex items-center gap-1.5 px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors' },
                  h('span', {}, '+'), 'New Request')))),
          h('main', { className: 'flex-1 overflow-y-auto px-6 py-5' },
            h('div', { className: 'grid grid-cols-5 gap-3 mb-5' },
              [['all','Total','text-slate-300'],['new','New','text-blue-400'],['in_progress','In Progress','text-purple-400'],['blocked','Blocked','text-red-400'],['done','Done','text-green-400']]
                .map(([key, label, color]) =>
                  h('div', { key, className: 'bg-slate-800 border border-slate-700 rounded-xl p-3 text-center' },
                    h('div', { className: `text-2xl font-bold ${color}` }, counts[key] || 0),
                    h('div', { className: 'text-xs text-slate-500 mt-0.5' }, label)))),
            h('div', { className: 'flex flex-wrap gap-2 mb-5' },
              h('div', { className: 'flex items-center gap-1.5' },
                h('span', { className: 'text-xs text-slate-500 font-medium' }, 'Status:'),
                ['all','new','in_progress','blocked','done'].map(s =>
                  h(FilterChip, { key: s, label: s === 'all' ? 'All' : STATUS_LABELS[s], active: filterStatus === s, onClick: () => setFilterStatus(s) }))),
              h('div', { className: 'flex items-center gap-1.5 ml-3' },
                h('span', { className: 'text-xs text-slate-500 font-medium' }, 'Priority:'),
                ['all','urgent','high','medium','low'].map(p =>
                  h(FilterChip, { key: p, label: p === 'all' ? 'All' : PRIORITY_LABELS[p], active: filterPriority === p, onClick: () => setFilterPriority(p) })))),
            loading
              ? h('div', { className: 'flex items-center justify-center py-20' },
                  h('div', { className: 'w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin' }))
              : filtered.length === 0
                ? h('div', { className: 'flex flex-col items-center justify-center py-20 text-center' },
                    h('div', { className: 'text-4xl mb-3' }, '📋'),
                    h('p', { className: 'text-slate-400 font-medium' }, requests.length === 0 ? 'No requests yet' : 'No requests match'),
                    h('p', { className: 'text-slate-500 text-sm mt-1' }, 'Create your first request to get started.'),
                    h('button', { onClick: () => setRequestModal('new'), className: 'mt-4 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm rounded-lg' }, '+ New Request'))
                : h('div', { className: 'flex flex-col gap-3' },
                    filtered.map(r => h(RequestCard, { key: r.id, request: r,
                      category: r.category_id ? categories.find(c => c.id === r.category_id) : null,
                      onClick: setRequestModal })),
                    h('p', { className: 'text-center text-xs text-slate-600 mt-2' }, `${filtered.length} of ${requests.length} requests`)))),
        requestModal && h(RequestModal, { request: requestModal === 'new' ? null : requestModal, categories,
          onClose: () => setRequestModal(null), onSave: handleSaveRequest, onDelete: handleDeleteRequest, loading: saving }),
        categoryModal && h(CategoryModal, { category: categoryModal === 'new' ? null : categoryModal,
          onClose: () => setCategoryModal(null), onSave: handleSaveCategory, onDelete: handleDeleteCategory, loading: saving }));
    }

    // --- Root ---
    function App() {
      const [session, setSession] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => { setSession(session); setAuthLoading(false); });
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, s) => setSession(s));
        return () => subscription.unsubscribe();
      }, []);
      if (authLoading) return h('div', { className: 'min-h-screen bg-slate-900 flex items-center justify-center' },
        h('div', { className: 'w-8 h-8 border-2 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin' }));
      return session ? h(MainApp, { session }) : h(LoginPage, {});
    }

    createRoot(document.getElementById('root')).render(h(App, null));
  </script>
</body>
</html>
